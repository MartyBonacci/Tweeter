openapi: 3.0.0
info:
  title: Tweeter API
  description: A Twitter-like social networking API with user management, tweets, follows, and likes
  version: 1.0.0
  contact:
    name: Tweeter API Team
    email: api@tweeter.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.tweeter.example.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

security:
  - bearerAuth: []

paths:
  # Authentication Endpoints
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Creates a new user account with username, email, name, and password
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              validRegistration:
                summary: Valid registration request
                value:
                  username: johndoe
                  email: john@example.com
                  name: John Doe
                  password: SecurePass123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
        '400':
          description: Validation failed or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates user and returns access token and sets cookies
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              validLogin:
                summary: Valid login credentials
                value:
                  email: john@example.com
                  password: SecurePass123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Secure; SameSite=Strict; Max-Age=900; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Logs out the current user by clearing authentication cookies
      operationId: logoutUser
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=; HttpOnly; Secure; SameSite=Strict; Max-Age=0; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Users Endpoints
  /api/users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieves paginated list of users with optional search
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Number of users to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of users to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          description: Search term for username, name, or bio
          schema:
            type: string
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Retrieves a user's public profile information
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Users
      summary: Update user profile
      description: Updates the authenticated user's profile information
      operationId: updateUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}/follow:
    get:
      tags:
        - Users
      summary: Get user follow data
      description: Retrieves a user's followers and following lists
      operationId: getUserFollowData
      parameters:
        - name: userId
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Follow data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowDataResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Users
      summary: Follow user
      description: Follows a user (creates follow relationship)
      operationId: followUser
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user UUID to follow
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Successfully followed user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Cannot follow yourself or already following
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Unfollow user
      description: Unfollows a user (removes follow relationship)
      operationId: unfollowUser
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user UUID to unfollow
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully unfollowed user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Not following this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Tweets Endpoints
  /api/tweets:
    get:
      tags:
        - Tweets
      summary: List tweets
      description: Retrieves paginated list of tweets with optional filtering
      operationId: listTweets
      parameters:
        - name: limit
          in: query
          description: Number of tweets to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of tweets to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: userId
          in: query
          description: Filter tweets by specific user ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tweets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TweetsListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Tweets
      summary: Create tweet
      description: Creates a new tweet
      operationId: createTweet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTweetRequest'
            examples:
              validTweet:
                summary: Valid tweet
                value:
                  content: "Hello, Twitter! This is my first tweet."
      responses:
        '201':
          description: Tweet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TweetCreationResponse'
        '400':
          description: Validation failed or content too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tweets/{tweetId}:
    get:
      tags:
        - Tweets
      summary: Get tweet
      description: Retrieves a specific tweet by ID
      operationId: getTweet
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tweet retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TweetResponse'
        '404':
          description: Tweet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Tweets
      summary: Update tweet
      description: Updates the content of an existing tweet (only by the tweet's author)
      operationId: updateTweet
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTweetRequest'
      responses:
        '200':
          description: Tweet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TweetResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tweet not found or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Tweets
      summary: Delete tweet
      description: Deletes a tweet (only by the tweet's author)
      operationId: deleteTweet
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID to delete
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tweet deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tweet not found or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tweets/user/{userId}:
    get:
      tags:
        - Tweets
      summary: Get user tweets
      description: Retrieves all tweets from a specific user
      operationId: getUserTweets
      parameters:
        - name: userId
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of tweets to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of tweets to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: User tweets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TweetsListResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tweets/{tweetId}/like:
    get:
      tags:
        - Likes
      summary: Get tweet likes
      description: Retrieves the list of users who liked a tweet
      operationId: getTweetLikes
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Likes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikesResponse'
        '404':
          description: Tweet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Likes
      summary: Like tweet
      description: Likes a tweet
      operationId: likeTweet
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID to like
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Successfully liked tweet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Already liked this tweet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tweet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Likes
      summary: Unlike tweet
      description: Unlikes a tweet
      operationId: unlikeTweet
      parameters:
        - name: tweetId
          in: path
          required: true
          description: Tweet UUID to unlike
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully unliked tweet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Not liked this tweet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tweet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Authentication Schemas
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - name
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          description: Username must be 3-20 characters, alphanumeric and underscores only
          example: johndoe
        email:
          type: string
          format: email
          maxLength: 320
          description: Valid email address
          example: john@example.com
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name for the user
          example: John Doe
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Password must contain uppercase, lowercase, and number
          example: SecurePass123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john@example.com
        password:
          type: string
          description: User's password
          example: SecurePass123

    UserRegistrationResponse:
      type: object
      properties:
        message:
          type: string
          example: "User registered successfully"
        user:
          $ref: '#/components/schemas/PublicUser'

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIs..."

    # User Schemas
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john@example.com
        name:
          type: string
          example: John Doe
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane Doe
        bio:
          type: string
          example: "Updated bio information"
        avatarUrl:
          type: string
          format: uri
          example: "https://example.com/new-avatar.jpg"

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    FollowDataResponse:
      type: object
      properties:
        followers:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        following:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        counts:
          type: object
          properties:
            followers:
              type: integer
              example: 42
            following:
              type: integer
              example: 15

    # Tweet Schemas
    CreateTweetRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 140
          example: "Hello, Twitter! This is my first tweet."

    UpdateTweetRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 140
          example: "Updated tweet content here"

    Tweet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 140
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TweetWithUser:
      allOf:
        - $ref: '#/components/schemas/Tweet'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'

    TweetResponse:
      type: object
      properties:
        tweet:
          $ref: '#/components/schemas/TweetWithUser'

    TweetCreationResponse:
      type: object
      properties:
        tweet:
          $ref: '#/components/schemas/Tweet'
        message:
          type: string
          example: "Tweet created successfully"

    TweetsListResponse:
      type: object
      properties:
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/TweetWithUser'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Likes Schemas
    LikesResponse:
      type: object
      properties:
        likers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              username:
                type: string
              name:
                type: string
              createdAt:
                type: string
                format: date-time
        count:
          type: integer
          example: 5

    # Common Schemas
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        hasMore:
          type: boolean
          example: true

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Error description"

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string
              code:
                type: string